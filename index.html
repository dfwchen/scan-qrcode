<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>扫码</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsqr.min.js"></script>
<style>
body{margin:0;padding:0;text-align:center;background:#000;}
video{width:100%;max-width:600px;}
#btn{margin:10px;padding:10px 20px;font-size:16px;}
</style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<div><button id="btn">开始扫码</button></div>
<p id="res" style="color:#fff;"></p>

<script>
let v=document.getElementById('v');
let btn=document.getElementById('btn');
let res=document.getElementById('res');
let stream=null;

btn.onclick=async()=>{
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    v.srcObject=stream;
    scanLoop();
  }catch(e){
    res.textContent='打不开摄像头：'+e.message;
  }
};

function scanLoop(){
  let canvas=document.createElement('canvas');
  let ctx=canvas.getContext('2d');
  canvas.width=v.videoWidth;
  canvas.height=v.videoHeight;
  ctx.drawImage(v,0,0);
  let code=jsqr(ctx.getImageData(0,0,canvas.width,canvas.height),canvas.width,canvas.height);
  if(code){
    res.textContent='结果：'+code.data;
  }
  requestAnimationFrame(scanLoop);
}
</script>
</body>
</html>
