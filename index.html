<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>二维码对比工具</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            transition: background 0.3s;
        }
        #video-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1/1;
            overflow: hidden;
            border-radius: 12px;
            margin: 10px 0;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 不翻转，保持原始镜像效果，看着更自然 */
            transform: scaleX(1);
        }
        #status {
            font-size: 24px;
            font-weight: bold;
            margin: 15px;
            text-align: center;
        }
        .qr-data {
            font-size: 12px;
            word-break: break-all;
            max-width: 90%;
            margin: 5px;
            padding: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            font-family: monospace;
        }
        button {
            padding: 12px 30px;
            font-size: 18px;
            margin: 10px;
            border: none;
            border-radius: 25px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
        }
        button:active {
            background: #388E3C;
        }
        .vibrate-warning {
            background: red !important;
            animation: pulse 0.5s infinite alternate;
        }
        @keyframes pulse {
            from { background: red; }
            to { background: darkred; }
        }
    </style>
</head>
<body>
    <div id="status">等待开始...</div>
    <div id="video-container">
        <video id="video" autoplay playsinline muted></video>
    </div>
    <div id="qr1-data" class="qr-data">物料码: 未扫描</div>
    <div id="qr2-data" class="qr-data">振动盘码: 未扫描</div>
    <button id="start-btn">开始对比流程</button>
    <button id="reset-btn" style="background:#f44336;">重置</button>

    <!-- 引入 jsQR 库 -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    
    <script>
        const video = document.getElementById('video');
        const statusDiv = document.getElementById('status');
        const qr1DataDiv = document.getElementById('qr1-data');
        const qr2DataDiv = document.getElementById('qr2-data');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        const body = document.body;

        let stream = null;
        let animationFrameId = null;
        let qr1RawValue = null;   // 物料码完整内容
        let qr1Extracted = null;  // 物料码截取后的值
        let qr2Value = null;      // 振动盘码完整内容
        let currentTarget = 1;    // 1: 等待扫描物料码, 2: 等待扫描振动盘码
        let scanLocked = false;
        let secondScanTimer = null;
        let isRunning = false;

        // 从长物料码中截取：从最后一个P开始到末尾
        // 例如：ABCDEF-P123456-001 -> P123456-001
        function extractMaterialCode(fullCode) {
            if (!fullCode) return null;
            
            // 找到最后一个P的位置（不区分大小写）
            const lastPIndex = fullCode.toUpperCase().lastIndexOf('P');
            
            if (lastPIndex === -1) {
                // 如果没找到P，返回原始内容（也可以根据需求返回null或抛出警告）
                console.warn('物料码中未找到P标识，将使用完整码对比');
                return fullCode;
            }
            
            return fullCode.substring(lastPIndex);
        }

        // 启动摄像头
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: "environment", // 后置摄像头
                        width: { ideal: 1280 },
                        height: { ideal: 1280 }
                    }
                });
                video.srcObject = stream;
                video.setAttribute("playsinline", true);
                video.play();
                return true;
            } catch (err) {
                console.error('摄像头启动失败:', err);
                statusDiv.textContent = '❌ 摄像头权限被拒绝或不可用';
                return false;
            }
        }

        // 停止摄像头
        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
                video.srcObject = null;
            }
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
        }

        // 触发震动
        function vibrateDevice(pattern) {
            if (navigator.vibrate) {
                navigator.vibrate(pattern);
            }
        }

        // 全屏红色警告 - 物料码与振动盘码不一致
        function triggerMismatchWarning(materialCode, vibratorCode) {
            body.classList.add('vibrate-warning');
            statusDiv.innerHTML = `❌ 不匹配！<br>物料: ${materialCode}<br>振动盘: ${vibratorCode}`;
            vibrateDevice([200, 100, 200, 100, 500]); // 强烈震动
            isRunning = false;
            scanLocked = true;
            
            // 5秒后自动恢复
            setTimeout(() => {
                resetAll();
            }, 5000);
        }

        // 重置所有状态
        function resetAll() {
            body.classList.remove('vibrate-warning');
            qr1RawValue = null;
            qr1Extracted = null;
            qr2Value = null;
            currentTarget = 1;
            scanLocked = false;
            isRunning = true;
            if (secondScanTimer) {
                clearTimeout(secondScanTimer);
                secondScanTimer = null;
            }
            qr1DataDiv.textContent = '物料码: 未扫描';
            qr2DataDiv.textContent = '振动盘码: 未扫描';
            statusDiv.textContent = '📱 请扫描物料码...';
        }

        // 扫描循环
        function scanLoop() {
            if (!isRunning || !video.videoWidth) {
                animationFrameId = requestAnimationFrame(scanLoop);
                return;
            }

            // 创建离屏canvas，水平翻转以匹配实际画面（可选项）
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            
            // 如果需要画面与镜头保持一致，这里翻转canvas
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

            // 使用jsQR解析
            const code = jsQR(imageData.data, imageData.width, imageData.height, {
                inversionAttempts: "dontInvert",
            });

            if (code && !scanLocked) {
                const scannedData = code.data.trim();
                
                if (currentTarget === 1) {
                    // ========== 扫描物料码 ==========
                    qr1RawValue = scannedData;
                    qr1Extracted = extractMaterialCode(scannedData);
                    
                    qr1DataDiv.innerHTML = `物料码(完整): ${qr1RawValue}<br>物料码(截取): <strong>${qr1Extracted}</strong>`;
                    statusDiv.innerHTML = `✅ 物料码已记录<br>截取码: ${qr1Extracted}<br>1秒后扫描振动盘...`;
                    
                    currentTarget = 2;
                    scanLocked = true;
                    
                    // 1秒后解锁扫描振动盘
                    secondScanTimer = setTimeout(() => {
                        scanLocked = false;
                        statusDiv.textContent = '🔍 请扫描振动盘二维码...';
                        secondScanTimer = null;
                    }, 1000);
                    
                } else if (currentTarget === 2) {
                    // ========== 扫描振动盘码 ==========
                    qr2Value = scannedData;
                    qr2DataDiv.textContent = `振动盘码: ${qr2Value}`;
                    scanLocked = true;
                    
                    // 对比：物料码截取部分 vs 振动盘码完整内容
                    if (qr1Extracted === qr2Value) {
                        statusDiv.textContent = '✅ 匹配成功！自动继续...';
                        vibrateDevice(50); // 短震提示成功
                        
                        setTimeout(() => {
                            resetAll();
                        }, 1000);
                    } else {
                        triggerMismatchWarning(qr1Extracted, qr2Value);
                    }
                }
            }

            animationFrameId = requestAnimationFrame(scanLoop);
        }

        // 开始流程
        async function startProcess() {
            if (isRunning) return;
            
            const cameraReady = await startCamera();
            if (!cameraReady) return;
            
            resetAll();
            isRunning = true;
            scanLoop();
            startBtn.textContent = '运行中...';
            startBtn.style.opacity = '0.6';
        }

        // 手动重置
        function manualReset() {
            stopCamera();
            resetAll();
            isRunning = false;
            startBtn.textContent = '开始对比流程';
            startBtn.style.opacity = '1';
            statusDiv.textContent = '已重置，准备重新开始';
        }

        startBtn.addEventListener('click', startProcess);
        resetBtn.addEventListener('click', manualReset);

        // 页面关闭时释放摄像头
        window.addEventListener('beforeunload', () => {
            stopCamera();
        });
    </script>
</body>
</html>
