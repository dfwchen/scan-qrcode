<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>扫码对比工具</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        
        .header {
            padding: 20px 15px 15px;
            text-align: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.95), rgba(0,0,0,0.8));
            z-index: 10;
        }
        
        .title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .subtitle {
            font-size: 13px;
            color: #999;
        }
        
        .scan-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #111;
        }
        
        #camera-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* AI自动框 - 模拟微信的绿色框 */
        .auto-frame {
            position: absolute;
            border: 2px solid #00c853;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 200, 83, 0.3);
            pointer-events: none;
            z-index: 5;
            transition: all 0.3s ease-out;
            opacity: 0;
        }
        
        .auto-frame.detected {
            opacity: 1;
        }
        
        .scan-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00e676, transparent);
            animation: scanDown 2s ease-in-out infinite;
            pointer-events: none;
            z-index: 6;
        }
        
        @keyframes scanDown {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        
        .status-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            z-index: 10;
            pointer-events: none;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .status-info { background: rgba(0,0,0,0.7); color: #fff; }
        .status-success { background: rgba(0,200,83,0.8); color: #fff; }
        .status-error { background: rgba(255,0,0,0.8); color: #fff; }
        
        .info-panel {
            padding: 15px;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 10;
        }
        
        .info-row {
            display: flex;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            font-size: 13px;
        }
        
        .info-label {
            color: #999;
            min-width: 60px;
        }
        
        .info-value {
            color: #00e676;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            flex: 1;
            word-break: break-all;
        }
        
        .btn-panel {
            display: flex;
            gap: 10px;
            padding: 10px 15px 25px;
            background: rgba(0,0,0,0.95);
            z-index: 10;
        }
        
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
        }
        
        .btn:active {
            transform: scale(0.96);
        }
        
        .btn-start {
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #000;
        }
        
        .btn-reset {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        
        .progress-dots {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transition: all 0.3s;
        }
        
        .dot.active {
            background: #00e676;
            box-shadow: 0 0 10px #00e676;
            width: 10px;
            height: 10px;
        }
        
        .dot.done {
            background: #00c853;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">二维码对比工具</div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px;">
            <div class="progress-dots">
                <div class="dot active" id="dot1"></div>
                <span style="color:#555;">→</span>
                <div class="dot" id="dot2"></div>
            </div>
        </div>
    </div>
    
    <div class="scan-area" id="scan-area">
        <video id="camera-view" autoplay playsinline muted></video>
        <div class="auto-frame" id="auto-frame">
            <div class="scan-line"></div>
        </div>
        <div class="status-overlay status-info" id="status-overlay">
            📱 对准物料码
        </div>
    </div>
    
    <div class="info-panel">
        <div class="info-row">
            <span class="info-label">物料码</span>
            <span class="info-value" id="info-material">等待扫描...</span>
        </div>
        <div class="info-row">
            <span class="info-label">振动盘</span>
            <span class="info-value" id="info-vibrator">等待扫描...</span>
        </div>
    </div>
    
    <div class="btn-panel">
        <button class="btn btn-start" id="btn-start">▶ 开始扫描</button>
        <button class="btn btn-reset" id="btn-reset">↺ 重置</button>
    </div>

    <!-- 使用ZXing库，识别率更高 -->
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
    <script src="scanner.js"></script>
</body>
</html>
