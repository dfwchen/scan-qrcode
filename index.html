<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>二维码对比工具 - 系统相机版</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            transition: background 0.3s;
        }
        #status {
            font-size: 24px;
            font-weight: bold;
            margin: 15px;
            text-align: center;
        }
        .qr-data {
            font-size: 14px;
            word-break: break-all;
            max-width: 90%;
            margin: 5px;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            font-family: monospace;
            line-height: 1.6;
        }
        button {
            padding: 15px 40px;
            font-size: 20px;
            margin: 10px;
            border: none;
            border-radius: 30px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        button:active {
            background: #388E3C;
            transform: scale(0.95);
        }
        .scan-btn {
            width: 80%;
            max-width: 300px;
            font-size: 22px;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .scan-btn:active {
            background: linear-gradient(135deg, #5a6fd6 0%, #6a3f8f 100%);
        }
        .vibrate-warning {
            background: red !important;
            animation: pulse 0.3s infinite alternate;
        }
        @keyframes pulse {
            from { background: #ff0000; }
            to { background: #cc0000; }
        }
        .progress {
            width: 80%;
            max-width: 300px;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: #4CAF50;
            transition: width 0.5s;
            border-radius: 3px;
        }
        .step-indicator {
            display: flex;
            gap: 20px;
            margin: 10px 0;
        }
        .step {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.3s;
        }
        .step.active {
            background: #4CAF50;
            transform: scale(1.2);
        }
        .step.done {
            background: #2196F3;
        }
    </style>
</head>
<body>
    <div id="status">📱 二维码对比工具</div>
    
    <div class="step-indicator">
        <div class="step" id="step1">1</div>
        <div class="step" id="step2">2</div>
    </div>
    
    <div class="progress">
        <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
    </div>
    
    <div id="qr1-data" class="qr-data">物料码: 未扫描</div>
    <div id="qr2-data" class="qr-data">振动盘码: 未扫描</div>
    
    <button id="scan-btn" class="scan-btn">📷 扫描二维码</button>
    <button id="reset-btn" style="background:#f44336;">🔄 重置</button>
    
    <input type="file" id="file-input" accept="image/*" capture="environment" style="display: none;">

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    
    <script>
        const statusDiv = document.getElementById('status');
        const qr1DataDiv = document.getElementById('qr1-data');
        const qr2DataDiv = document.getElementById('qr2-data');
        const scanBtn = document.getElementById('scan-btn');
        const resetBtn = document.getElementById('reset-btn');
        const fileInput = document.getElementById('file-input');
        const progressBar = document.getElementById('progress-bar');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const body = document.body;

        let qr1Extracted = null;
        let qr2Value = null;
        let currentStep = 1; // 1: 等待物料码, 2: 等待振动盘码
        let isProcessing = false;

        function extractMaterialCode(fullCode) {
            if (!fullCode) return null;
            const lastPIndex = fullCode.toUpperCase().lastIndexOf('P');
            if (lastPIndex === -1) return fullCode;
            return fullCode.substring(lastPIndex);
        }

        function vibrateDevice(pattern) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        function updateUI() {
            if (currentStep === 1) {
                step1.classList.add('active');
                step1.classList.remove('done');
                step2.classList.remove('active', 'done');
                progressBar.style.width = '0%';
                scanBtn.textContent = '📷 扫描物料码';
                statusDiv.textContent = '请扫描物料码...';
            } else if (currentStep === 2) {
                step1.classList.remove('active');
                step1.classList.add('done');
                step2.classList.add('active');
                progressBar.style.width = '50%';
                scanBtn.textContent = '📷 扫描振动盘码';
                statusDiv.textContent = '请扫描振动盘码...';
            }
        }

        // 核心：用图片文件解析二维码
        function decodeQRFromImage(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height, {
                        inversionAttempts: "attemptBoth",
                    });
                    
                    if (code) {
                        resolve(code.data.trim());
                    } else {
                        reject(new Error('未识别到二维码'));
                    }
                };
                img.onerror = () => reject(new Error('图片加载失败'));
                img.src = URL.createObjectURL(file);
            });
        }

        async function handleFileSelect(event) {
            if (isProcessing) return;
            
            const file = event.target.files[0];
            if (!file) return;
            
            isProcessing = true;
            scanBtn.textContent = '⏳ 识别中...';
            scanBtn.style.opacity = '0.7';
            
            try {
                const scannedData = await decodeQRFromImage(file);
                
                if (currentStep === 1) {
                    // 扫描物料码
                    qr1Extracted = extractMaterialCode(scannedData);
                    qr1DataDiv.innerHTML = `物料码(截取): <strong>${qr1Extracted}</strong>`;
                    statusDiv.textContent = '✅ 物料码已记录';
                    vibrateDevice(100);
                    
                    currentStep = 2;
                    updateUI();
                    
                } else if (currentStep === 2) {
                    // 扫描振动盘码
                    qr2Value = scannedData;
                    qr2DataDiv.textContent = `振动盘码: ${qr2Value}`;
                    
                    // 对比
                    if (qr1Extracted === qr2Value) {
                        statusDiv.textContent = '✅ 匹配成功！';
                        progressBar.style.width = '100%';
                        vibrateDevice(50);
                        
                        // 1秒后自动重置继续
                        setTimeout(() => {
                            resetAll();
                        }, 1500);
                    } else {
                        // 不匹配警告
                        body.classList.add('vibrate-warning');
                        statusDiv.innerHTML = `❌ 不匹配！<br>物料: ${qr1Extracted}<br>振动盘: ${qr2Value}`;
                        vibrateDevice([200, 100, 200, 100, 200, 100, 500]);
                        isProcessing = false;
                        
                        setTimeout(() => {
                            resetAll();
                        }, 5000);
                        return;
                    }
                }
            } catch (error) {
                statusDiv.textContent = '❌ ' + error.message;
                vibrateDevice([100, 100, 100]);
                setTimeout(() => {
                    updateUI();
                }, 1000);
            }
            
            isProcessing = false;
            scanBtn.style.opacity = '1';
            scanBtn.textContent = currentStep === 1 ? '📷 扫描物料码' : '📷 扫描振动盘码';
            
            // 清空input，允许重复选择同一文件
            fileInput.value = '';
        }

        function resetAll() {
            body.classList.remove('vibrate-warning');
            qr1Extracted = null;
            qr2Value = null;
            currentStep = 1;
            isProcessing = false;
            qr1DataDiv.textContent = '物料码: 未扫描';
            qr2DataDiv.textContent = '振动盘码: 未扫描';
            scanBtn.style.opacity = '1';
            updateUI();
        }

        scanBtn.addEventListener('click', () => {
            if (isProcessing) return;
            fileInput.click();
        });
        
        fileInput.addEventListener('change', handleFileSelect);
        resetBtn.addEventListener('click', resetAll);

        // 初始化
        updateUI();
    </script>
</body>
</html>
