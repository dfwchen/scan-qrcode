<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>物料振动盘扫码匹配</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:微软雅黑;padding:15px;background:#f5f5f5;}
        .title{font-size:22px;text-align:center;margin-bottom:15px;font-weight:bold;}
        #video{
            width:100%;
            max-width:420px;
            border:2px solid #007aff;
            border-radius:10px;
            display:block;
            margin:0 auto 15px;
            background:#000;
        }
        .info-box{
            background:#fff;
            padding:15px;
            border-radius:10px;
            margin-bottom:15px;
        }
        .info-item{font-size:17px;margin:8px 0;}
        .result{
            font-size:19px;
            text-align:center;
            padding:15px;
            border-radius:10px;
            margin-bottom:20px;
        }
        .ok{background:#e8f5e9;color:#2e7d32;}
        .no{background:#ffebee;color:#c62828;}
        button{
            width:100%;
            max-width:420px;
            padding:14px;
            font-size:17px;
            border-radius:8px;
            border:none;
            margin:8px auto;
            display:block;
            background:#007aff;
            color:#fff;
        }
        canvas{display:none;}
    </style>
</head>
<body>
    <div class="title">物料振动盘扫码匹配</div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div class="info-box">
        <div class="info-item">物料码：<span id="material">未扫描</span></div>
        <div class="info-item">振动盘：<span id="vib">未扫描</span></div>
    </div>

    <div id="result" class="result">等待扫码匹配</div>

    <button onclick="openCamera()">打开摄像头</button>
    <button onclick="doScan()">点击扫码识别</button>
    <button onclick="resetAll()">重置重新开始</button>

<script>
let materialCode = "";
let vibCode = "";
let isMatScan = true;
let mediaStream = null;

const allowList = ["PD19191-2","PE10529-1","PE10526-1","PE10672"];

// 只打开摄像头，不自动扫码
async function openCamera(){
    if(mediaStream) stopCam();
    try{
        mediaStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" }
        });
        document.getElementById('video').srcObject = mediaStream;
    }catch(err){
        alert("请允许摄像头权限，必须HTTPS访问");
    }
}

// 手动点击才解码一次
function doScan(){
    const v = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    if(!mediaStream){
        alert("请先打开摄像头");
        return;
    }
    if(v.readyState < 2){
        alert("摄像头画面还没准备好，稍等再点");
        return;
    }

    canvas.width = v.videoWidth;
    canvas.height = v.videoHeight;
    ctx.drawImage(v,0,0);
    let codeRes = jsQR(ctx.getImageData(0,0,canvas.width,canvas.height),canvas.width,canvas.height);

    if(codeRes){
        onScanSuccess(codeRes.data);
    }else{
        alert("未识别到二维码，请对准后再点一次");
    }
}

function stopCam(){
    if(mediaStream){
        mediaStream.getTracks().forEach(t=>t.stop());
        mediaStream = null;
    }
}

function onScanSuccess(txt){
    stopCam();
    let s = txt.trim();
    let idx = Math.max(s.indexOf("PD"), s.indexOf("PE"));
    let code = idx >=0 ? s.slice(idx) : s;

    if(isMatScan){
        materialCode = code;
        document.getElementById("material").innerText = code;
        isMatScan = false;
    }else{
        vibCode = code;
        document.getElementById("vib").innerText = code;
        isMatScan = true;
    }
    checkMatch();
}

function checkMatch(){
    let el = document.getElementById("result");
    if(!materialCode || !vibCode){
        el.innerText = "请继续扫描第二个码";
        el.className = "result";
        return;
    }
    let ok = (materialCode === vibCode) && allowList.includes(materialCode);
    if(ok){
        el.innerText = "✅ 匹配成功，可以投料";
        el.className = "result ok";
    }else{
        el.innerText = "❌ 不匹配，禁止投料";
        el.className = "result no";
    }
}

function resetAll(){
    stopCam();
    materialCode = "";
    vibCode = "";
    isMatScan = true;
    document.getElementById("material").innerText = "未扫描";
    document.getElementById("vib").innerText = "未扫描";
    document.getElementById("result").innerText = "等待扫码匹配";
    document.getElementById("result").className = "result";
}
</script>
</body>
</html>
