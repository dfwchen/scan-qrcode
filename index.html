<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>二维码对比工具</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            transition: background 0.3s;
        }
        #video-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1/1;
            overflow: hidden;
            border-radius: 12px;
            margin: 10px 0;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        #status {
            font-size: 24px;
            font-weight: bold;
            margin: 15px;
            text-align: center;
        }
        .qr-data {
            font-size: 14px;
            word-break: break-all;
            max-width: 90%;
            margin: 5px;
            padding: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
        }
        button {
            padding: 12px 30px;
            font-size: 18px;
            margin: 10px;
            border: none;
            border-radius: 25px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
        }
        button:active {
            background: #388E3C;
        }
        .vibrate-warning {
            background: red !important;
            animation: pulse 0.5s infinite alternate;
        }
        @keyframes pulse {
            from { background: red; }
            to { background: darkred; }
        }
    </style>
</head>
<body>
    <div id="status">等待开始...</div>
    <div id="video-container">
        <video id="video" autoplay playsinline muted></video>
    </div>
    <div id="qr1-data" class="qr-data">二维码1: 未扫描</div>
    <div id="qr2-data" class="qr-data">二维码2: 未扫描</div>
    <button id="start-btn">开始对比流程</button>
    <button id="reset-btn" style="background:#f44336;">重置</button>

    <!-- 引入 jsQR 库 -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    
    <script>
        const video = document.getElementById('video');
        const statusDiv = document.getElementById('status');
        const qr1DataDiv = document.getElementById('qr1-data');
        const qr2DataDiv = document.getElementById('qr2-data');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        const body = document.body;

        let stream = null;
        let animationFrameId = null;
        let qr1Value = null;
        let qr2Value = null;
        let currentTarget = 1; // 1: 等待扫描第一个, 2: 等待扫描第二个
        let scanLocked = false;  // 防止重复扫描
        let secondScanTimer = null;
        let isRunning = false;

        // 启动摄像头
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" } // 后置摄像头
                });
                video.srcObject = stream;
                video.setAttribute("playsinline", true);
                video.play();
                return true;
            } catch (err) {
                console.error('摄像头启动失败:', err);
                statusDiv.textContent = '摄像头权限被拒绝或不可用';
                return false;
            }
        }

        // 停止摄像头
        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
                video.srcObject = null;
            }
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
        }

        // 触发震动 (需要设备支持)
        function vibrateDevice(pattern) {
            if (navigator.vibrate) {
                navigator.vibrate(pattern);
            }
        }

        // 全屏红色警告
        function triggerMismatchWarning() {
            body.classList.add('vibrate-warning');
            statusDiv.textContent = '❌ 不一致！二维码不匹配！';
            vibrateDevice([200, 100, 200, 100, 500]); // 持续震动
            isRunning = false;
            scanLocked = true;
            
            // 5秒后自动恢复，重置所有状态
            setTimeout(() => {
                resetAll();
            }, 5000);
        }

        // 重置所有状态
        function resetAll() {
            body.classList.remove('vibrate-warning');
            qr1Value = null;
            qr2Value = null;
            currentTarget = 1;
            scanLocked = false;
            isRunning = true;
            if (secondScanTimer) {
                clearTimeout(secondScanTimer);
                secondScanTimer = null;
            }
            qr1DataDiv.textContent = '二维码1: 未扫描';
            qr2DataDiv.textContent = '二维码2: 未扫描';
            statusDiv.textContent = '请扫描第一个二维码...';
        }

        // 扫描循环
        function scanLoop() {
            if (!isRunning || !video.videoWidth) {
                animationFrameId = requestAnimationFrame(scanLoop);
                return;
            }

            // 创建离屏canvas来获取视频帧
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

            // 使用jsQR解析
            const code = jsQR(imageData.data, imageData.width, imageData.height, {
                inversionAttempts: "dontInvert",
            });

            if (code && !scanLocked) {
                const scannedData = code.data;
                
                if (currentTarget === 1) {
                    // 扫描到第一个码
                    qr1Value = scannedData;
                    qr1DataDiv.textContent = `二维码1: ${scannedData}`;
                    statusDiv.textContent = '✅ 第一个码已记录，准备扫描第二个...';
                    currentTarget = 2;
                    scanLocked = true; // 锁定，防止瞬间重复扫描
                    
                    // 1秒后解锁，开始扫描第二个
                    secondScanTimer = setTimeout(() => {
                        scanLocked = false;
                        statusDiv.textContent = '请扫描第二个二维码...';
                        secondScanTimer = null;
                    }, 1000);
                    
                } else if (currentTarget === 2) {
                    // 扫描到第二个码
                    qr2Value = scannedData;
                    qr2DataDiv.textContent = `二维码2: ${scannedData}`;
                    scanLocked = true;
                    
                    // 进行对比
                    if (qr1Value === qr2Value) {
                        statusDiv.textContent = '✅ 两个二维码一致！重置并继续...';
                        vibrateDevice(100); // 短震提示成功
                        
                        // 延迟1秒后重置，自动循环
                        setTimeout(() => {
                            resetAll();
                        }, 1000);
                    } else {
                        triggerMismatchWarning();
                    }
                }
            }

            animationFrameId = requestAnimationFrame(scanLoop);
        }

        // 开始流程
        async function startProcess() {
            if (isRunning) return;
            
            const cameraReady = await startCamera();
            if (!cameraReady) return;
            
            resetAll();
            isRunning = true;
            scanLoop();
            startBtn.textContent = '运行中...';
            startBtn.style.opacity = '0.6';
        }

        // 手动重置
        function manualReset() {
            stopCamera();
            resetAll();
            isRunning = false;
            startBtn.textContent = '开始对比流程';
            startBtn.style.opacity = '1';
            statusDiv.textContent = '已重置，准备重新开始';
        }

        startBtn.addEventListener('click', startProcess);
        resetBtn.addEventListener('click', manualReset);

        // 页面关闭时释放摄像头
        window.addEventListener('beforeunload', () => {
            stopCamera();
        });
    </script>
</body>
</html>
